name: Research - weekly capability check

# WHY WEEKLY, AND WHY IT WRITES NOTHING.
#
# The ten capability checks are research: a person opens a page and records what
# it says. That cannot be automated without inventing findings, which is the
# exact failure research/dpp_evidence.py exists to prevent. So this job never
# produces a finding and never edits the layer.
#
# What it does is make the published layer defensible a month after it was
# researched: every cited evidence_url is re-fetched, coverage is measured
# against the framework's own rules, and the age of the newest research is
# stated. A dead citation under a published claim about a named company is the
# failure that matters, and until this existed nothing was watching for one -
# the layer was generated on 2026-08-05 and never re-read.
#
# WHAT MAKES IT GO RED, and why the list is short. The first run, 24 Aug 2026,
# went red for three reasons and two of them were noise:
#
#   - 14 consultancies unassessed. That is an open RESEARCH decision, not a
#     defect. Failing on it every Monday until somebody rules would teach
#     everyone to ignore the mail.
#   - "research is 19 days old". That threshold was invented in this repo: the
#     register declares event_driven and the capability layer declares no
#     cadence at all. "Run a check weekly" meant run the CHECK weekly, not
#     re-do a manual research batch weekly.
#   - two fabacus.com citations returning 500. Its ROOT DOMAIN was 500 too -
#     the site was down, the pages were not gone.
#
# Red is now reserved for what is ours and fixable: a cited page has GONE
# (4xx), or the layer carries findings the framework exempts. Everything else
# is reported in the run output and does not fail.

on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays 07:00 UTC, after the daily pull
  workflow_dispatch:

jobs:
  capability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Coverage, staleness and every published citation
        run: python3 research/dpp_capability_check.py --links --check
